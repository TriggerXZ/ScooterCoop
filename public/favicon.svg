<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#FFF8F0" stroke="#2D2D2D" stroke-width="4"/>

  <!-- Pink circle decoration -->
  <circle cx="95" cy="35" r="18" fill="#FF6B9D"/>

  <!-- Yellow triangle decoration -->
  <polygon points="25,95 45,55 5,55" fill="#FFE135"/>

  <!-- Scooter icon simplified Memphis style -->
  <g transform="translate(32, 40)">
    <!-- Wheels -->
    <circle cx="8" cy="44" r="8" fill="none" stroke="#2D2D2D" stroke-width="4"/>
    <circle cx="52" cy="44" r="8" fill="none" stroke="#2D2D2D" stroke-width="4"/>

    <!-- Body -->
    <path d="M8 44 L20 20 L40 20 L52 44" fill="none" stroke="#00ADEE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Handlebar -->
    <path d="M40 20 L46 8 L58 8" fill="none" stroke="#00ADEE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="4" width="12" height="10" rx="2" fill="#39FF14"/>

    <!-- Seat -->
    <ellipse cx="30" cy="18" rx="14" ry="5" fill="#00ADEE"/>

    <!-- Deck -->
    <rect x="12" y="48" width="40" height="6" rx="3" fill="#00ADEE"/>
  </g>

  <!-- Lime squiggle decoration -->
  <path d="M20 30 Q 32 20, 44 30 T 68 30 T 92 30" stroke="#39FF14" stroke-width="3" fill="none"/>
</svg>